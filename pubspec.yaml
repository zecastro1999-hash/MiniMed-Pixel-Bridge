name: minimed_pixel_bridge
description: "Medtronic MiniMed 780G to Google Health Connect & Material You Widget Bridge for Pixel 10a."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  health: ^13.3.2
  home_widget: ^0.10.0
  workmanager: ^0.10.10
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.1
  intl: ^0.20.3
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
